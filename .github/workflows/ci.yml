name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bodrye_bot_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bodrye_bot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:55432/bodrye_bot_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -e . --group dev

      - name: Validate live plan
        run: python scripts/check_plan.py Plan.md

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src evals

      - name: Test
        run: python -m pytest -v
