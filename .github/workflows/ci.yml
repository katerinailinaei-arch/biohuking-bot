name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plan-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate live plan
        run: python scripts/check_plan.py Plan.md

      - name: Test plan tooling
        run: python -m unittest discover -s tests/unit/scripts -p "test_*.py" -v
